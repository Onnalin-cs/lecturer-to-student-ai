<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecturer-to-Student AI 🎓</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Kanit -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <div class="max-w-4xl mx-auto px-4 py-8">
    
    <!-- Header Section -->
    <header class="text-center mb-8 space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-semibold">
        ✨ AI Final Project 2026
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900">
        Lecturer-to-Student <span class="text-indigo-600">AI</span> 🎓
      </h1>
      <p class="text-slate-600 text-sm md:text-base max-w-lg mx-auto">
        เปลี่ยนสไลด์อาจารย์ภาษาวิชาการ/ศัพท์ยากๆ ให้กลายเป็นเรื่องเข้าใจง่ายในภาษาเด็กมหาลัย
      </p>
    </header>

    <!-- Main Card -->
    <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-slate-200/60 border border-slate-100 mb-8 space-y-6">
      
      <!-- Section 1: เลือกรายวิชา -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">📚 เลือกรายวิชา:</label>
        <select id="subjectSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="วิชาทั่วไป">🌐 วิชาทั่วไป / General</option>
          <option value="วิทยาการคอมพิวเตอร์">💻 วิทยาการคอมพิวเตอร์ / IT</option>
          <option value="วิทยาศาสตร์/ชีววิทยา">🧬 สรีรวิทยา / ชีววิทยา / เคมี</option>
          <option value="บริหาร/เศรษฐศาสตร์">📊 บริหารธุรกิจ / เศรษฐศาสตร์</option>
          <option value="ภาษาต่างประเทศ">🗣️ ภาษาต่างประเทศ</option>
        </select>
      </div>

      <!-- Section 2: เลือกรูปภาพ -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">📸 เลือกรูปภาพสไลด์ หรือชีทเรียน:</label>
        
        <div class="border-2 border-dashed border-indigo-200 bg-indigo-50/30 rounded-2xl p-6 text-center">
          
          <div id="uploadBox" class="space-y-4">
            <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            
            <!-- ปุ่มกดเลือกรูปจริง -->
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" class="block mx-auto text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
          </div>

          <!-- แสดงพรีวิวรูปภาพ -->
          <div id="previewContainer" class="hidden space-y-3">
            <img id="imagePreview" class="max-h-72 mx-auto rounded-xl shadow-md border border-slate-200 object-contain">
            <button type="button" onclick="removeImage()" class="text-xs bg-red-100 hover:bg-red-200 text-red-600 font-semibold px-3 py-1.5 rounded-lg transition">
              🗑️ ลบรูปภาพนี้
            </button>
          </div>

        </div>
      </div>

      <!-- Action Button -->
      <button type="button" onclick="processImage()" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition duration-200">
        แปลเป็นภาษาเพื่อน 🚀
      </button>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="hidden text-center py-12 space-y-4">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="text-slate-600 font-medium">AI กำลังวิเคราะห์สไลด์และแปลเป็นภาษาเพื่อนให้อยู่แป๊บหนึ่งนะ...</p>
    </div>

    <!-- Result Display Cards -->
    <div id="resultCard" class="hidden space-y-5">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-indigo-600 bg-indigo-100 px-3 py-1 rounded-full" id="resultSubjectTag">วิชา: 一般</span>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-sm border-l-4 border-indigo-500 border-y border-r border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 mb-2">📌 สรุปใจความสำคัญ (3 บรรทัด)</h3>
        <div id="summaryText" class="text-slate-700 whitespace-pre-line text-sm md:text-base bg-indigo-50/40 p-4 rounded-xl"></div>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-sm border-l-4 border-amber-500 border-y border-r border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 mb-2">💡 เปรียบเทียบกับชีวิตประจำวัน</h3>
        <div id="analogyText" class="text-slate-700 text-sm md:text-base bg-amber-50/40 p-4 rounded-xl"></div>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-sm border-l-4 border-emerald-500 border-y border-r border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 mb-2">📚 คำศัพท์วิชาการน่ารู้</h3>
        <div id="vocabText" class="text-slate-700 whitespace-pre-line text-sm md:text-base bg-emerald-50/40 p-4 rounded-xl"></div>
      </div>
    </div>

  </div>

  <script>
    // 
    const GEMINI_API_KEY = "AQ.Ab8RN6IR2KYm1NDZ4DMSyd4ahCntd8Vi3120JD5kwhiYQXcaaw";

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('uploadBox').classList.add('hidden');
          document.getElementById('previewContainer').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
